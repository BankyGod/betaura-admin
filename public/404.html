<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetAura Admin - Loading...</title>
    <script>
      (function() {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        // If the path isn't root, redirect into hash router path so it never 404s
        var target = '/#' + (path.startsWith('/') ? path : '/' + path) + search + hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #00b074;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8; font-weight: 600;">Loading BetAura Admin Portal...</p>
    </div>
  </body>
</html>
